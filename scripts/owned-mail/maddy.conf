hostname mail.codexdentist.com
state_dir /data
runtime_dir /tmp
log stderr
debug no

target.remote outbound {
    force_ipv4 yes
    requiretls_override no
    mx_auth {
        mtasts
        local_policy {
            min_tls_level encrypted
        }
    }
}

target.queue outgoing_queue {
    target &outbound
    location /data/queue
    max_parallelism 2
    max_tries 8
    initial_retry_time 5m
    post_init_delay 30s
}

# No public SMTP/IMAP listener. Only the gateway shares this internal network.
smtp tls://0.0.0.0:2465 {
    tls file /secrets/smtp.cert.pem /secrets/smtp.key.pem
    io_debug no
    debug no
    dmarc no
    read_timeout 30s
    write_timeout 30s
    max_message_size 96K
    max_header_size 8K
    buffer ram
    limits {
        all concurrency 4
        all rate 10 1m
    }
    source no-reply@codexdentist.com {
        modify {
            dkim codexdentist.com cdx202611
        }
        default_destination {
            deliver_to &outgoing_queue
        }
    }
    default_source {
        reject 550 5.7.1 "Sender not permitted"
    }
}
