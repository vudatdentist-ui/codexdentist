worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  keepalive_timeout 15s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host sign.codexdentist.com;
  proxy_set_header X-Forwarded-Host sign.codexdentist.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  proxy_buffering off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;

  # Private application API. Its network has no published port and the API
  # still enforces the CE team's token. Never expose this listener via Traefik.
  server {
    listen 3443 ssl;
    server_name codexdentist-signing-gateway;
    ssl_certificate /secrets/gateway.cert.pem;
    ssl_certificate_key /secrets/gateway.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $signing_upstream http://app:3000;
    location = /ready { proxy_pass $signing_upstream/api/health; }
    location /api/v2/ { proxy_pass $signing_upstream; }
    location / { return 404; }
  }

  # Recipient web ceremony only. Administrative/auth/API-key and bulk API
  # routes remain unavailable even if their upstream loaders change.
  server {
    listen 8080;
    server_name sign.codexdentist.com;
    set $signing_upstream http://app:3000;
    location = /ready { return 200 'recipient gateway ready'; }
    location = /robots.txt { return 200 'User-agent: *\nDisallow: /\n'; }
    location ~ ^/(?:assets|static|fonts)/ { proxy_pass $signing_upstream; }
    location = /__manifest { limit_except GET { deny all; } proxy_pass $signing_upstream; }
    location = /api/auth/session-json { limit_except GET { deny all; } proxy_pass $signing_upstream; }
    location ~ ^/api/files/token/[A-Za-z0-9_-]+/envelope/[A-Za-z0-9_-]+/envelopeItem/[A-Za-z0-9_-]+/dataId/[A-Za-z0-9_-]+/(?:current|signed)/item\.pdf$ {
      limit_except GET { deny all; }
      proxy_pass $signing_upstream;
    }
    location = /favicon.ico { proxy_pass $signing_upstream; }
    location ~ ^/(?:sign|report)/[A-Za-z0-9_-]+(?:/[^?]*)?$ { proxy_pass $signing_upstream; }
    location ~ ^/api/branding/logo/team/[0-9]+$ { proxy_pass $signing_upstream; }
    location ~ ^/api/trpc/(?:envelope\.field\.sign|envelope\.signingStatus|envelope\.attachment\.find|envelope\.recipient\.report|recipient\.completeDocumentWithToken|recipient\.rejectDocumentWithToken|field\.signFieldWithToken|field\.removeSignedFieldWithToken)$ {
      proxy_pass $signing_upstream;
    }
    location / { return 404; }
  }
}
