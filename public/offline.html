<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Codexdentist offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7f8;
        color: #17202a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 420px);
        border: 1px solid #d8e1e3;
        border-radius: 12px;
        background: #ffffff;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #61717c;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Đang mất kết nối</h1>
      <p>
        Codexdentist không lưu cache hồ sơ bệnh án trên thiết bị. Vui lòng kết nối lại
        Internet để đăng nhập và tải dữ liệu mới nhất.
      </p>
    </main>
  </body>
</html>
