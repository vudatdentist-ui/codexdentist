name: Design review source snapshot
on:
  pull_request:
    paths:
      - .github/workflows/design-review-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/design-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: design-source-${{ github.sha }}
          path: ${{ runner.temp }}/design-source.tar.gz
          retention-days: 1
          if-no-files-found: error
