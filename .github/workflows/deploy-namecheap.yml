name: Deploy Namecheap production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ secrets.NAMECHEAP_HOST }}
      DEPLOY_PORT: ${{ secrets.NAMECHEAP_PORT }}
      DEPLOY_USER: ${{ secrets.NAMECHEAP_USER }}
      DEPLOY_APP_ROOT: ${{ secrets.NAMECHEAP_APP_ROOT }}
      DEPLOY_DOMAIN: ${{ secrets.NAMECHEAP_DOMAIN }}
      REMOTE_ARCHIVE: .codexdentist-release-${{ github.event.workflow_run.head_sha || github.sha }}.tar.gz

    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in RELEASE_SHA DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_APP_ROOT DEPLOY_DOMAIN; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing deployment value for ${variable}." >&2
              exit 1
            fi
          done
          case "$DEPLOY_APP_ROOT" in
            /*) ;;
            *) echo "NAMECHEAP_APP_ROOT must be an absolute path." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Create source archive
        shell: bash
        run: git archive --format=tar.gz --output=release.tar.gz "$RELEASE_SHA"

      - name: Configure pinned SSH host
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload source archive
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_ARCHIVE"

      - name: Build, migrate, and restart cPanel app
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_SHA' '$DEPLOY_APP_ROOT' '$REMOTE_ARCHIVE' '$DEPLOY_DOMAIN'" \
            < scripts/deploy-namecheap.sh

      - name: Verify production health and stability
        shell: bash
        run: |
          set -euo pipefail

          check_health() {
            local response
            response="$(curl --fail --silent --show-error --location --max-time 20 \
              "https://${DEPLOY_DOMAIN}/api/health")" || return 1
            HEALTH_RESPONSE="$response" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH_RESPONSE);
          if (health.status !== "ok" || health.database !== "ok") {
            throw new Error(`Unhealthy production response: ${JSON.stringify(health)}`);
          }
          NODE
          }

          ready=0
          for attempt in {1..12}; do
            if check_health; then
              ready=1
              break
            fi
            sleep 5
          done

          if [[ "$ready" != "1" ]]; then
            echo "Production health check failed after deployment." >&2
            exit 1
          fi

          # A single successful request can hide an app process that dies just
          # after restart on shared hosting. Require sustained health before the
          # deployment is accepted.
          for attempt in {1..6}; do
            sleep 10
            if ! check_health; then
              echo "Production became unhealthy during the post-deploy stability window." >&2
              exit 1
            fi
          done

          echo "Production application and database stayed healthy for 60 seconds."
