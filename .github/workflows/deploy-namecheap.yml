# Production deploys only run from a successful push CI run for the current main SHA.
name: Deploy Namecheap production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: namecheap-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexdentist
          POSTGRES_PASSWORD: codexdentist
          POSTGRES_DB: codexdentist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexdentist -d codexdentist"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      JOB_SECRET: ci-only-job-secret-with-at-least-32-characters
      APP_BASE_URL: https://codexdentist.test
      PATIENT_FILE_STORAGE_DRIVER: local
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run encoding:check
      - run: npm run typecheck
      - run: npm run agent:audit
      - name: Validate deployment guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-namecheap.sh
          node --check scripts/check-migration-safety.mjs
      - run: node scripts/phase2-architecture-check.mjs
      - run: node scripts/phase3-architecture-check.mjs
      - run: node scripts/phase4-architecture-check.mjs
      - run: node scripts/phase5-architecture-check.mjs
      - run: node scripts/phase6-architecture-check.mjs
      - run: docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
      - run: npx prisma migrate deploy
      - run: npm run test:disposable-restore
        env:
          RESTORE_DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist_restore
          RESTORE_TARGET_MARKER: CODEXDENTIST_DISPOSABLE_RESTORE
      - run: npx prisma db seed
        env:
          NODE_ENV: test
      - run: npm run test:seed-users
        env:
          NODE_ENV: test
      - run: npm run test:hardening
      - run: npm run test:security
      - run: npm run test:security-runtime
      - run: npm run test:roles
      - run: npm run test:tenant
      - run: npm run test:billing
      - run: npm run test:billing-concurrency
      - run: npm run test:actions
      - run: npm run test:settings-forms
      - run: npm run test:integration-substrate
      - run: npm run test:journey-file-command
      - run: npm run test:phase3
      - run: npm run test:phase4
      - run: npm run test:phase4:scope
      - run: npm run test:phase5
      - run: npm run test:phase5:sterilization
      - run: npm run test:phase6
      - run: npm run test:patient-files
      - run: npm run test:file-lifecycle
      - run: npm run test:organization-purge
      - run: npm run test:data-integrity
      - run: npm run test:compensation
      - run: npm run test:source-commission
      - run: npm run build
      - name: Start production server for API smoke
        run: |
          npm start > /tmp/codexdentist-deploy-preflight.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/codexdentist-deploy-preflight.log
          exit 1
      - run: npm run test:smoke
      - run: npm run readiness:check
      - run: npm run test:api-contract
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:qa
        env:
          NODE_ENV: test

  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.NAMECHEAP_HOST }}
      DEPLOY_PORT: ${{ secrets.NAMECHEAP_PORT }}
      DEPLOY_USER: ${{ secrets.NAMECHEAP_USER }}
      DEPLOY_APP_ROOT: ${{ secrets.NAMECHEAP_APP_ROOT }}
      DEPLOY_DOMAIN: ${{ secrets.NAMECHEAP_DOMAIN }}
      REMOTE_ARCHIVE: .codexdentist-release-${{ github.event.workflow_run.head_sha }}.tar.gz

    steps:
      - name: Resolve release eligibility
        id: release
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ -z "$current_main_sha" ]]; then
            echo "Could not resolve current main SHA." >&2
            exit 1
          fi

          if [[ "$RELEASE_SHA" != "$current_main_sha" ]]; then
            echo "Skipping stale release $RELEASE_SHA; current main is $current_main_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Check deployment configuration
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for variable in RELEASE_SHA DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_APP_ROOT DEPLOY_DOMAIN; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing deployment value for ${variable}." >&2
              exit 1
            fi
          done
          case "$DEPLOY_APP_ROOT" in
            /*) ;;
            *) echo "NAMECHEAP_APP_ROOT must be an absolute path." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: steps.release.outputs.deploy == 'true'
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Download verified production artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: codexdentist-production-${{ env.RELEASE_SHA }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded artifact
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: test -s release-artifact/release.tar.gz

      - name: Configure pinned SSH host
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload verified release artifact
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            release-artifact/release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_ARCHIVE"

      - name: Migrate and atomically cut over cPanel app
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_SHA' '$DEPLOY_APP_ROOT' '$REMOTE_ARCHIVE' '$DEPLOY_DOMAIN'" \
            < scripts/deploy-namecheap.sh

      - name: Verify production externally
        if: steps.release.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check_health() {
            local response
            response="$(curl --fail --silent --show-error --location --max-time 20 \
              "https://${DEPLOY_DOMAIN}/api/health")" || return 1
            HEALTH_RESPONSE="$response" node <<'NODE'
          const health = JSON.parse(process.env.HEALTH_RESPONSE);
          if (health.status !== "ok" || health.database !== "ok" || health.schema !== "ok") {
            throw new Error(`Unhealthy production response: ${JSON.stringify(health)}`);
          }
          NODE
          }

          for route in / /login; do
            curl --fail --silent --show-error --location --max-time 20 \
              --output /dev/null "https://${DEPLOY_DOMAIN}${route}"
          done

          for attempt in {1..3}; do
            check_health
            sleep 10
          done

          echo "Production passed external health and route verification."
