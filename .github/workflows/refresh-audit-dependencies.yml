name: Refresh audited dependency lockfile

on:
  push:
    branches: [audit/fix-production-hardening-20260915]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[audit-deps-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/fix-production-hardening-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Pin patched transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set \
            dependencies.sharp=0.35.4 \
            overrides.sharp=0.35.4 \
            overrides.fast-uri=4.1.4 \
            overrides.hono=4.13.7 \
            overrides.postcss=8.5.28 \
            overrides.nanoid=3.3.19 \
            overrides.mysql2=3.24.4 \
            overrides.deepmerge-ts=8.0.2
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch audited production dependencies [audit-deps-bot]"
          git push origin HEAD:audit/fix-production-hardening-20260915
