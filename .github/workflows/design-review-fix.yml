name: Apply reviewed source correction
on:
  pull_request:
    paths: [.github/workflows/design-review-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'design/narrative-workspace-20260923' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Correct the display using the existing authorized clinic list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/patients/PatientsPanel.tsx')
          s = p.read_text(encoding='utf-8')
          old = '{selectedPatient.clinic}'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '{visibleClinics.find((clinic) => clinic.id === selectedPatient.clinicId)?.name ?? text.unknown}'), encoding='utf-8')
          PY
          git diff --check
          git add src/modules/patients/PatientsPanel.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): resolve patient clinic through the authorized clinic collection'
          git push origin HEAD:design/narrative-workspace-20260923
