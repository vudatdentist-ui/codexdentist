name: Landing offline parts
on:
  push:
    branches: [qa/landing-baseline-20260922]
permissions:
  contents: read
  actions: read
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-offline-e7ce96b
          run-id: 35692124656
          github-token: ${{ github.token }}
      - run: split -b 75m landing-offline.tar.gz landing-part-
      - uses: actions/upload-artifact@v4
        with:
          name: landing-part-aa
          path: landing-part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: landing-part-ab
          path: landing-part-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: landing-part-ac
          path: landing-part-ac
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: landing-part-ad
          path: landing-part-ad
          compression-level: 0
          retention-days: 1
