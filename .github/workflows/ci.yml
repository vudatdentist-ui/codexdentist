name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexdentist
          POSTGRES_PASSWORD: codexdentist
          POSTGRES_DB: codexdentist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexdentist -d codexdentist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist?schema=public
      APP_BASE_URL: https://codexdentist.test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      JOB_SECRET: ci-only-job-secret-with-at-least-32-characters
      PATIENT_FILE_STORAGE_DRIVER: local
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXY_PROVIDER: reverse-proxy

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run encoding:check
      - run: npm run typecheck
      - run: node scripts/agent-module-audit.mjs
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
        env:
          NODE_ENV: test
      - run: npm run test:seed-users
        env:
          NODE_ENV: test
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/codexdentist.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/codexdentist.log
          exit 1
      - name: Agent health and legacy route smoke
        run: |
          node scripts/agent-health-check.mjs
          npm run test:smoke || { cat /tmp/codexdentist.log; exit 1; }
        env:
          NODE_ENV: test
          SMOKE_MIGRATION_ROUTES: "/work,/schedule,/care,/patients/[patientId],/treatment,/patients/[patientId]/treatments/[treatmentServiceId],/operations,/operations/finance"
      - name: Runtime security, tenant, billing, and file tests
        run: |
          npm run test:security
          npm run test:security-runtime
          npm run test:tenant
          npm run test:billing
          npm run test:billing-concurrency
          npm run test:actions
          npm run test:patient-files
          npm run test:data-integrity
        env:
          NODE_ENV: test
      - name: Browser QA
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npx playwright install --with-deps chromium
          node scripts/reset-smoke-rate-limits.mjs
          npm run browser:qa
          node scripts/reset-smoke-rate-limits.mjs
          node scripts/clinical-execution-smoke.mjs
          node scripts/reset-smoke-rate-limits.mjs
          node scripts/staff-operations-smoke.mjs
          node scripts/reset-smoke-rate-limits.mjs
          node scripts/finance-einvoice-smoke.mjs
          node scripts/reset-smoke-rate-limits.mjs
          node scripts/einvoice-concurrency-smoke.mjs
          node scripts/reset-smoke-rate-limits.mjs
          node scripts/patient-access-smoke.mjs
        env:
          NODE_ENV: test
          BROWSER_QA_MIGRATION_ROUTES: "/today,/work,/schedule,/care,/patients/[patientId],/treatment,/patients/[patientId]/treatments/[treatmentServiceId],/operations,/operations/finance,/employee-app"
      - run: docker build -t codexdentist:ci .
