name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexdentist
          POSTGRES_PASSWORD: codexdentist
          POSTGRES_DB: codexdentist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexdentist -d codexdentist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist?schema=public
      APP_BASE_URL: https://codexdentist.test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      JOB_SECRET: ci-only-job-secret-with-at-least-32-characters
      PATIENT_FILE_STORAGE_DRIVER: local
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXY_PROVIDER: reverse-proxy
      PAYOS_DEFAULT_CLIENT_ID: phase3-ci-client
      PAYOS_DEFAULT_API_KEY: phase3-ci-api-key
      PAYOS_DEFAULT_CHECKSUM_KEY: ci-phase3-payos-checksum-secret

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run encoding:check
      - run: npm run typecheck
      - run: node scripts/agent-module-audit.mjs
      - run: node scripts/phase2-architecture-check.mjs
      - name: Validate deployment guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-namecheap.sh
          node --check scripts/check-migration-safety.mjs
      - name: Enforce backward-compatible migrations
        run: node scripts/check-migration-safety.mjs
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node scripts/phase3-architecture-check.mjs
      - run: node scripts/phase4-architecture-check.mjs
      - run: node scripts/phase5-architecture-check.mjs
      - run: node scripts/phase6-architecture-check.mjs
      - run: npm run test:domain-operations
      - run: docker compose --env-file .env.selfhost.example -f compose.selfhost.yml config --quiet
      - run: npx prisma migrate deploy
      - run: npm run test:disposable-restore
        env:
          RESTORE_DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist_restore
          RESTORE_TARGET_MARKER: CODEXDENTIST_DISPOSABLE_RESTORE
          POSTGRES_TOOL_IMAGE: postgres:17-alpine
      - run: npx prisma db seed
        env:
          NODE_ENV: test
      - run: npm run test:seed-users
        env:
          NODE_ENV: test
      - run: npm run test:hardening
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/codexdentist.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/codexdentist.log
          exit 1
      - name: Install browser runtime for API and browser smoke
        run: npx playwright install --with-deps chromium
      - name: Agent health and legacy route smoke
        run: |
          set -Eeuo pipefail
          trap 'status=$?; if [[ "$status" -ne 0 ]]; then echo "--- production server log ---"; tail -n 300 /tmp/codexdentist.log || true; fi; exit "$status"' EXIT
          npm run readiness:check
          node scripts/agent-health-check.mjs
          npm run test:smoke
          npm run test:api-contract
        env:
          NODE_ENV: test
      - name: Runtime security, tenant, billing, journey, integration, and file tests
        run: |
          npm run test:security
          npm run test:security-runtime
          npm run test:roles
          npm run test:tenant
          npm run test:billing
          npm run test:billing-concurrency
          npm run test:actions
          npm run test:settings-forms
          npm run test:integration-substrate
          npm run test:journey-file-command
          npm run test:organization-purge
          npm run test:phase3
          npm run test:phase4
          npm run test:phase4:scope
          npm run test:phase5
          npm run test:phase5:sterilization
          npm run test:phase6
          npm run test:patient-files
          npm run test:file-lifecycle
          npm run test:data-integrity
          npm run test:compensation
          npm run test:source-commission
          npm run test:pilot-workflows
        env:
          NODE_ENV: test
      - name: Browser QA
        run: |
          set -Eeuo pipefail
          trap 'status=$?; if [[ "$status" -ne 0 ]]; then echo "--- production server log ---"; tail -n 300 /tmp/codexdentist.log || true; fi; exit "$status"' EXIT
          npm run browser:qa
        env:
          NODE_ENV: test
      - run: docker build -t codexdentist:ci .
      - name: Stop verification server
        shell: bash
        run: pkill -f 'next start' || true
      - name: Build hosted production release
        shell: bash
        env:
          CODEXDENTIST_BUILD: "1"
          DEPLOYMENT_MODE: hosted
          APP_BASE_URL: https://codexdentist.com
          APP_ROOT_DOMAIN: codexdentist.com
          PATIENT_FILE_STORAGE_DRIVER: r2
          R2_ENDPOINT: https://r2-build.invalid
          R2_BUCKET_NAME: build-placeholder
          R2_ACCESS_KEY_ID: build-placeholder
          R2_SECRET_ACCESS_KEY: build-placeholder
          SESSION_COOKIE_SECURE: "true"
          TRUSTED_PROXY_PROVIDER: cloudflare
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build
          test -d .next
      - name: Verify hosted release boots
        shell: bash
        env:
          CODEXDENTIST_BUILD: "1"
          DEPLOYMENT_MODE: hosted
          APP_BASE_URL: https://codexdentist.com
          APP_ROOT_DOMAIN: codexdentist.com
          PATIENT_FILE_STORAGE_DRIVER: r2
          R2_ENDPOINT: https://r2-build.invalid
          R2_BUCKET_NAME: build-placeholder
          R2_ACCESS_KEY_ID: build-placeholder
          R2_SECRET_ACCESS_KEY: build-placeholder
          SESSION_COOKIE_SECURE: "true"
          TRUSTED_PROXY_PROVIDER: cloudflare
          PORT: "3001"
        run: |
          set -euo pipefail
          npm start > /tmp/codexdentist-hosted.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            pkill -f 'next start' >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --header "Host: ${APP_ROOT_DOMAIN}" \
              http://127.0.0.1:3001/api/health > /tmp/hosted-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              cat /tmp/codexdentist-hosted.log
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/codexdentist-hosted.log
            exit 1
          fi

          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/hosted-health.json","utf8"));if(h.status!=="ok"||h.database!=="ok"||h.schema!=="ok")process.exit(1)'
          curl --fail --silent --location --header "Host: ${APP_ROOT_DOMAIN}" \
            --output /dev/null http://127.0.0.1:3001/login
      - name: Package production release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > .codexdentist-release-sha
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./release.tar.gz' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./.tmp' \
            --exclude='./coverage' \
            --exclude='./playwright-report' \
            --exclude='./storage' \
            --exclude='./backups' \
            --exclude='./test-results' \
            -czf release.tar.gz .
          test -s release.tar.gz
          test -d .next
          test "$(cat .codexdentist-release-sha)" = "$GITHUB_SHA"
      - name: Upload production release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codexdentist-production-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7
