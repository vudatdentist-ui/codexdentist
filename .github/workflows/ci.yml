name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexdentist
          POSTGRES_PASSWORD: codexdentist
          POSTGRES_DB: codexdentist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexdentist -d codexdentist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DEPLOYMENT_MODE: self-hosted
      DATABASE_URL: postgresql://codexdentist:codexdentist@127.0.0.1:5432/codexdentist?schema=public
      APP_BASE_URL: https://codexdentist.test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      JOB_SECRET: ci-only-job-secret-with-at-least-32-characters
      PATIENT_FILE_STORAGE_DRIVER: local
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXY_PROVIDER: reverse-proxy
      TRIAL_SIGNUP_ENABLED: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run encoding:check
      - run: npm run typecheck
      - run: node scripts/agent-module-audit.mjs
      - run: node scripts/phase2-architecture-check.mjs
      - name: Validate deployment guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-namecheap.sh
          node --check scripts/check-migration-safety.mjs
      - name: Release and rollback regression tests
        run: node --test scripts/package-release.test.mjs scripts/deploy-namecheap.test.mjs
      - name: Enforce backward-compatible migrations
        run: node scripts/check-migration-safety.mjs
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
        env:
          NODE_ENV: test
      - run: npm run test:seed-users
        env:
          NODE_ENV: test
      - run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/codexdentist.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/codexdentist.log
          exit 1
      - name: Agent health and legacy route smoke
        run: |
          node scripts/agent-health-check.mjs
          npm run test:smoke
        env:
          NODE_ENV: test
      - name: Runtime security, tenant, billing, journey, integration, and file tests
        run: |
          npm run test:security
          npm run test:security-runtime
          npm run test:tenant
          npm run test:billing
          npm run test:billing-concurrency
          npm run test:actions
          npm run test:integration-substrate
          npm run test:journey-file-command
          npm run test:patient-files
          npm run test:file-lifecycle
          npm run test:data-integrity
          npm run test:compensation
          npm run test:pilot-workflows
        env:
          NODE_ENV: test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Landing responsive and interaction QA
        run: npm run browser:landing
      - name: Upload landing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-qa-${{ github.sha }}
          path: output/landing-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Browser QA
        run: npm run browser:qa
        env:
          NODE_ENV: test
      - name: Upload application browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-qa-${{ github.sha }}
          path: |
            output/playwright/pilot-browser-qa
            output/workspace-qa
          if-no-files-found: warn
          retention-days: 7
      - name: Hosted trial signup and expiry QA
        run: npm run browser:trial-signup
      - run: docker build -t codexdentist:ci .
      - name: Stop verification server
        shell: bash
        run: pkill -f 'next start' || true
      - name: Build hosted production release
        shell: bash
        env:
          CODEXDENTIST_BUILD: "1"
          DEPLOYMENT_MODE: hosted
          APP_BASE_URL: https://codexdentist.com
          APP_ROOT_DOMAIN: codexdentist.com
          PATIENT_FILE_STORAGE_DRIVER: r2
          R2_ENDPOINT: https://r2-build.invalid
          R2_BUCKET_NAME: build-placeholder
          R2_ACCESS_KEY_ID: build-placeholder
          R2_SECRET_ACCESS_KEY: build-placeholder
          SESSION_COOKIE_SECURE: "true"
          TRUSTED_PROXY_PROVIDER: cloudflare
        run: |
          set -euo pipefail
          rm -rf .next
          npm run build
          test -d .next
      - name: Package production release artifact
        shell: bash
        run: node scripts/package-release.mjs "$GITHUB_SHA" "$RUNNER_TEMP/codexdentist-artifact/release.tar.gz"
      - name: Install production-only runtime dependencies
        run: npm prune --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify extracted hosted release boots
        shell: bash
        env:
          CODEXDENTIST_BUILD: "1"
          DEPLOYMENT_MODE: hosted
          APP_BASE_URL: https://codexdentist.com
          APP_ROOT_DOMAIN: codexdentist.com
          PATIENT_FILE_STORAGE_DRIVER: r2
          R2_ENDPOINT: https://r2-build.invalid
          R2_BUCKET_NAME: build-placeholder
          R2_ACCESS_KEY_ID: build-placeholder
          R2_SECRET_ACCESS_KEY: build-placeholder
          SESSION_COOKIE_SECURE: "true"
          TRUSTED_PROXY_PROVIDER: cloudflare
          PORT: "3001"
          HOSTNAME: "127.0.0.1"
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d "$RUNNER_TEMP/codexdentist-runtime-XXXXXX")"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf -- "$release_dir"
          }
          trap cleanup EXIT
          tar -xzf "$RUNNER_TEMP/codexdentist-artifact/release.tar.gz" -C "$release_dir"
          test "$(cat "$release_dir/.codexdentist-release-sha")" = "$GITHUB_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$release_dir/node_modules"
          cd "$release_dir"
          node server.cjs > /tmp/codexdentist-hosted.log 2>&1 &
          server_pid=$!

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --header "Host: ${APP_ROOT_DOMAIN}" \
              http://127.0.0.1:3001/api/health > /tmp/hosted-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" >/dev/null 2>&1; then
              cat /tmp/codexdentist-hosted.log
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" != "1" ]]; then
            cat /tmp/codexdentist-hosted.log
            exit 1
          fi

          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/hosted-health.json","utf8"));if(h.status!=="ok"||h.database!=="ok"||h.schema!=="ok")process.exit(1)'
          curl --fail --silent --location --header "Host: ${APP_ROOT_DOMAIN}" \
            --output /dev/null http://127.0.0.1:3001/login
      - name: Upload production release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: codexdentist-production-${{ github.sha }}
          path: ${{ runner.temp }}/codexdentist-artifact/release.tar.gz
          if-no-files-found: error
          retention-days: 7
