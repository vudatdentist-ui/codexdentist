services:
  postgres:
    image: postgres:17-alpine
    container_name: nhavista-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vietnam_dental_suite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nhavista-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vietnam_dental_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nhavista-postgres-data:
